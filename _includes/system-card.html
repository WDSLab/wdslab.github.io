{%- comment -%} 서비스 카드 하나 (홈 넘겨 보는 줄). 화면 캡처는 systems.yml 의 shot → assets/systems/ {%- endcomment -%}
{%- assign s = include.system -%}
<a class="system" href="{{ s.url }}" target="_blank" rel="noopener noreferrer">
  <span class="shot">{% if s.shot %}<img src="{{ '/assets/systems/' | append: s.shot | append: '.jpg' | relative_url }}" alt="{{ s.name }} screenshot" loading="lazy"/>{% else %}<span class="shot-text"><b>{{ s.icon }}</b>{{ s.name }}</span>{% endif %}</span>
  <h3>{{ s.name }}<span>→</span></h3>
  <p>{{ s.tagline }}{% if s.note %} · {{ s.note }}{% endif %}</p>
</a>
