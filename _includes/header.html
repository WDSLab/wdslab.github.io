<header class="header">
  <div class="shell top">
    <a class="brand" href="{{ '/' | relative_url }}"><img class="logo-dark" src="{{ '/assets/wdslab-logo-1x.png' | relative_url }}?v=2" srcset="{{ '/assets/wdslab-logo-2x.png' | relative_url }}?v=2 2x, {{ '/assets/wdslab-logo-3x.png' | relative_url }}?v=2 3x" alt="WDSLab · What is the Data Science Laboratory" width="141" height="40"/><img class="logo-light" src="{{ '/assets/wdslab-logo-header-1x.png' | relative_url }}" srcset="{{ '/assets/wdslab-logo-header-2x.png' | relative_url }} 2x, {{ '/assets/wdslab-logo-header-3x.png' | relative_url }} 3x" alt="" width="141" height="40"/></a>
    <button aria-label="Toggle navigation menu" aria-controls="site-navigation" aria-expanded="false" class="hamburger"><span aria-hidden="true">☰</span></button>
    <nav class="nav" id="site-navigation">
      {% for item in site.data.navigation %}<a{% if item.key == page.nav %} class="active" aria-current="page"{% endif %} href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endfor %}
    </nav>
  </div>
  <div class="nav-backdrop" aria-hidden="true"></div>
</header>
